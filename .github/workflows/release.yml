name: Release merged pull request

on:
  pull_request:
    branches: [main]
    types: [closed]

# A release is created only for a PR that GitHub reports as merged. Direct pushes
# to main deliberately do not create releases.
permissions:
  contents: write
  pull-requests: read

# Do not calculate two versions from the same latest tag if PRs are merged close
# together. Queued runs are allowed to finish in order.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Check out main and its tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calculate release version
        id: version
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tags < <(git tag --merged HEAD -l 'v*' --sort=-v:refname)
          latest_tag=""
          for candidate in "${tags[@]}"; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done
          if [[ -z "$latest_tag" || ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "No valid vX.Y.Z tag reachable from main." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          bump="patch"

          # The highest-impact label wins if more than one is present.
          if jq -e --arg label 'release:major' 'index($label) != null' <<<"$LABELS" > /dev/null; then
            bump="major"
            major=$((major + 1)); minor=0; patch=0
          elif jq -e --arg label 'release:minor' 'index($label) != null' <<<"$LABELS" > /dev/null; then
            bump="minor"
            minor=$((minor + 1)); patch=0
          else
            # release:patch and PRs without a release label both create a patch release.
            patch=$((patch + 1))
          fi

          version="$major.$minor.$patch"
          tag="v$version"
          echo "Releasing $tag ($bump bump from $latest_tag)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Update extension version and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg version "$VERSION" '.version = $version' extension/manifest.json > manifest.json.tmp
          mv manifest.json.tmp extension/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main --follow-tags

  package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [firefox, chrome]

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Package extension
        id: package
        uses: ./.github/actions/package-extension
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.prepare.outputs.tag }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cat *.sha256 > checksums.txt
          cat checksums.txt

      - name: Create GitHub release and changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          previous_tag: ${{ needs.prepare.outputs.previous_tag }}
          target_commitish: main
          name: O'Reilly EPUB Downloader ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Release information

            This release contains the Firefox and Chrome builds of O'Reilly EPUB Downloader.

            ## Included files

            - `oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-firefox.zip`
            - `oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-chrome.zip`
            - `checksums.txt` — SHA-256 hashes for both packages

            ## Installation

            1. Download the package for your browser and extract it.
            2. In Firefox, open `about:debugging` and use **Load Temporary Add-on**.
            3. In Chrome, open `chrome://extensions`, enable Developer mode, and use **Load unpacked**.

            ## Integrity verification

            ```bash
            sha256sum -c checksums.txt --ignore-missing
            ```

            ## Changes

            The generated changelog below lists the pull requests included in this release.
          files: |
            oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-firefox.zip
            oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-chrome.zip
            checksums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "### Release created" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Packages:** Firefox and Chrome" >> "$GITHUB_STEP_SUMMARY"
