name: Validate extension

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [ firefox, chrome ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check release automation
        run: python3 .github/check-releases.py

      - name: Check manifest.json syntax
        run: |
          echo "Validating manifest.json..."
          jq -e '
            .manifest_version == 3 and
            (.name | type == "string" and length > 0) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.description | type == "string" and length > 0) and
            (.permissions | type == "array")
          ' extension/manifest.json > /dev/null
          echo "✅ manifest.json is valid JSON"

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          if grep -RnE '^(<<<<<<<|=======|>>>>>>>)' extension .github README.md; then
            echo "Unresolved merge marker found." >&2
            exit 1
          fi
          FILES=(
            "extension/manifest.json"
            "extension/compat.js"
            "extension/background.js"
            "extension/cache.js"
            "extension/pool.js"
            "extension/content.js"
            "extension/download.js"
            "extension/platform.js"
            "extension/popup.html"
            "extension/popup.js"
            "extension/lib/jszip.min.js"
            "scripts/build-extension.sh"
            "scripts/bump-version.py"
          )
          if [ "${{ matrix.target }}" = "chrome" ]; then
            FILES+=(
              "extension/sw.js"
              "extension/offscreen.html"
              "extension/offscreen.js"
            )
          fi
          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ $file exists"
            fi
          done

      - name: Check manifest version
        run: |
          VERSION=$(jq -r '.version' extension/manifest.json)
          echo "Extension version: $VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Must be X.Y.Z"
            exit 1
          fi
          echo "✅ Version format is valid"

      - name: Package extension
        id: package
        uses: ./.github/actions/package-extension
        with:
          target: ${{ matrix.target }}
          version: ci

      - name: Check packaged manifest
        run: |
          MANIFEST=build/manifest.json
          if [ "${{ matrix.target }}" = "chrome" ]; then
            jq -e '.background.service_worker == "sw.js"
                   and (.background.scripts == null)
                   and (.browser_specific_settings == null)
                   and (.permissions | index("offscreen"))' "$MANIFEST" > /dev/null
          else
            jq -e '(.background.scripts | length > 0)
                   and (.background.service_worker == null)
                   and (.permissions | index("offscreen") | not)' "$MANIFEST" > /dev/null
          fi
          echo "✅ ${{ matrix.target }} manifest is well-formed"

      - name: Check package
        run: |
          PACKAGE="${{ steps.package.outputs.package }}"
          unzip -t "$PACKAGE" > /dev/null
          if unzip -Z1 "$PACKAGE" | grep -E '(^|/)(test-.*\.html|README\.md)$'; then
            echo "Development files found in package" >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$PACKAGE")
          echo "Package size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ Package seems too small"
            exit 1
          fi

          echo "✅ Package created successfully"
          unzip -l "$PACKAGE"

      - name: Summary
        run: |
          echo "### ✅ Extension Validation Passed (${{ matrix.target }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All checks completed successfully." >> $GITHUB_STEP_SUMMARY
