name: Validate extension

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail
          jq empty extension/manifest.json
          jq -e '
            .manifest_version == 3 and
            (.name | type == "string" and length > 0) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.description | type == "string" and length > 0) and
            (.permissions | type == "array")
          ' extension/manifest.json > /dev/null

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            extension/manifest.json
            extension/background.js
            extension/cache.js
            extension/content.js
            extension/download.js
            extension/pool.js
            extension/popup.html
            extension/popup.js
            extension/lib/jszip.min.js
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

          if rg -n '^(<<<<<<<|=======|>>>>>>>)' extension; then
            echo "Unresolved merge marker found in extension source." >&2
            exit 1
          fi

      - name: Create release-like package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          package="dist/oreilly-epub-downloader-ci.zip"
          (
            cd extension
            zip -qr "../$package" . \
              -x 'test-*.html' \
              -x 'README.md' \
              -x '.DS_Store'
          )
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$PACKAGE" > /dev/null
          unzip -Z1 "$PACKAGE" | sort > package-contents.txt
          grep -Fx 'manifest.json' package-contents.txt > /dev/null
          ! grep -E '(^|/)(test-.*\.html|README\.md)$' package-contents.txt

          size="$(stat -c%s "$PACKAGE")"
          if (( size < 10000 )); then
            echo "Package is unexpectedly small: $size bytes." >&2
            exit 1
          fi

      - name: Publish validation summary
        run: |
          echo "### Extension validation passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Package size: $(stat -c%s "$PACKAGE") bytes" >> "$GITHUB_STEP_SUMMARY"
