name: Create pull request release candidate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

# RCs are only created for the develop -> main PR in this repository. This
# prevents executing code from forks with a token that can create tags/releases.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prerelease-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Calculate candidate version
        id: version
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          mapfile -t tags < <(git tag --merged origin/main -l 'v*' --sort=-v:refname)
          latest_tag=""
          for candidate in "${tags[@]}"; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done
          if [[ -z "$latest_tag" ]]; then
            echo "No valid vX.Y.Z tag reachable from main." >&2
            exit 1
          fi

          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          fi

          if jq -e --arg label 'release:major' 'index($label) != null' <<<"$LABELS" > /dev/null; then
            major=$((major + 1)); minor=0; patch=0
          elif jq -e --arg label 'release:minor' 'index($label) != null' <<<"$LABELS" > /dev/null; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          version="$major.$minor.$patch"
          tag="v$version-rc.pr-$PR_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Create or update candidate tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release candidate $TAG"
          git push --force origin "refs/tags/$TAG"

  package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [firefox, chrome]

    steps:
      - name: Check out candidate tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Browser manifest versions must be numeric, so the RC suffix is used in
      # the Git tag and package names only.
      - name: Set candidate manifest version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jq --arg version "$VERSION" '.version = $version' extension/manifest.json > manifest.json.tmp
          mv manifest.json.tmp extension/manifest.json

      - name: Package extension
        id: package
        uses: ./.github/actions/package-extension
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.prepare.outputs.tag }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cat *.sha256 > checksums.txt

      - name: Create or update release candidate
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Release candidate for PR #${{ github.event.pull_request.number }}
          body: |
            ## Purpose

            This is a test build for pull request #${{ github.event.pull_request.number }}.

            ## Candidate version

            `${{ needs.prepare.outputs.version }}`

            ## Included files

            - `oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-firefox.zip`
            - `oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-chrome.zip`
            - `checksums.txt` — SHA-256 hashes for both packages

            ## Installation and verification

            Install the extracted package through `about:debugging` (Firefox) or
            `chrome://extensions` with Developer mode enabled (Chrome). Verify it with:

            ```bash
            sha256sum -c checksums.txt --ignore-missing
            ```

            ## Status

            This prerelease is replaced whenever the `develop` → `main` PR changes.
            It is for testing only; the final release is published after merge and
            includes the generated changelog.
          files: |
            oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-firefox.zip
            oreilly-epub-downloader-${{ needs.prepare.outputs.tag }}-chrome.zip
            checksums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
