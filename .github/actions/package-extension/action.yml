name: Package extension
description: Build the browser-specific extension ZIP and its checksum

inputs:
  target:
    description: Browser to package for (firefox or chrome)
    required: true
  version:
    description: Version label used in the package file name
    required: true

outputs:
  package:
    description: Path to the generated ZIP
    value: ${{ steps.zip.outputs.package }}

runs:
  using: composite
  steps:
    - name: Stage files
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        rm -rf build
        cp -r extension build
        rm -f build/test-*.html build/README.md

        case "$TARGET" in
          firefox)
            # Chrome-only service worker entry and offscreen document
            rm -f build/sw.js build/offscreen.html build/offscreen.js
            ;;
          chrome)
            jq '.background = { service_worker: "sw.js" }
                | .permissions += ["offscreen"]
                | .minimum_chrome_version = "116"
                | del(.browser_specific_settings)' \
              extension/manifest.json > build/manifest.json
            ;;
          *)
            echo "Unknown target: $TARGET" >&2
            exit 1
            ;;
        esac

    - name: Create ZIP
      id: zip
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        PACKAGE="oreilly-epub-downloader-${VERSION}-${TARGET}.zip"
        (cd build && zip -r -X "../$PACKAGE" . -x ".DS_Store")
        sha256sum "$PACKAGE" > "$PACKAGE.sha256"
        echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
